tasks:
  # ПРЕДУПРЕЖДЕНИЕ ЗА 2 МИНУТЫ (в 8-ю, 18-ю, 28-ю минуту часа)
  warn-2min:
    schedule:
      type: "CRON"
      expression: "8,18,28,38,48,58 * * * *"
    command: "say &e&l[ОЧИСТКА] &fМусор будет удалён через &c2 минуты!"
    
  # ПРЕДУПРЕЖДЕНИЕ ЗА 1 МИНУТУ (в 9-ю, 19-ю, 29-ю минуту часа)
  warn-1min:
    schedule:
      type: "CRON"
      expression: "9,19,29,39,49,59 * * * *"
    command: "say &e&l[ОЧИСТКА] &fМусор будет удалён через &c1 минуту!"
    
  # САМА ОЧИСТКА (в 0-ю, 10-ю, 20-ю, 30-ю, 40-ю, 50-ю минуту часа)
  auto-clear:
    schedule:
      type: "CRON"
      expression: "0,10,20,30,40,50 * * * *"
    command: "clearlag clear"
